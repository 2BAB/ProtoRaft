name: Validate sample

on:
  pull_request:
  push:

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch collaboration scenario branches
        run: >-
          git fetch --no-tags origin
          +refs/heads/main:refs/remotes/origin/main
          +refs/heads/feature/morrow-listen:refs/remotes/origin/feature/morrow-listen
      - run: node scripts/validate-sample.mjs
